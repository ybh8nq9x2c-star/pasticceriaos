# =============================================================================
# CI minima — protegge i percorsi critici, niente di più.
#   app  : typecheck (tsc strict) + unit test (vitest)
#   sql  : catena migrations_v2 da zero (manifest supabase/migrations_v2/CHAIN)
#          su supabase/postgres in Docker + i test SQL di supabase/tests/SUITE.
#          La catena stessa è parte del test: se una migration non applica da
#          zero, la CI deve dirlo. Entry point unico: scripts/db/local.sh.
# NOTA: supabase/migrations/ (001–003 legacy, schema PRE-rewrite) NON va
# applicata: la verità è SOLO migrations_v2 (filtrata da CHAIN).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  sql:
    name: migrations + SQL tests
    runs-on: ubuntu-latest
    # W1: STESSO entrypoint del locale (scripts/db/local.sh → scripts/db/chain.sh).
    # DB supabase/postgres effimero in Docker, schema public vuoto, catena letta da
    # supabase/migrations_v2/CHAIN (i *_down.sql sono esclusi), test da
    # supabase/tests/SUITE, poi smoke della riconciliazione. Un solo punto di verità.
    steps:
      - uses: actions/checkout@v4
      - name: Chain from scratch + SQL tests + smoke
        run: bash scripts/db/local.sh all
      - name: Stop database
        if: always()
        run: bash scripts/db/local.sh stop
